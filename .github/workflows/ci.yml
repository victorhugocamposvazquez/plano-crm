name: Comprobar PLANO
on:
  pull_request:
  push:
    branches: [main, "codex/**", "claude/**"]
permissions:
  contents: read
concurrency:
  group: comprobaciones-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
